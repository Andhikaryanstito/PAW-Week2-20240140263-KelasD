<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Week 2</title>
</head>
<body>
    <header>
        <h1>Praktikum Week 2</h1>
        <nav><a href="#profile">Profile</a> <a href="#formdata">Form</a></nav>
    </header>
    <main>
        <section id="profile">
            <h2>Section Profile</h2>
            <p>Lorem ipsum dolor sit amet.</p>
        </section>
        <form id="formdata" action="#">
            <label for="nama">Masukan Nama Anda</label>
            <input type="text" id="nama" name="nama" required>
            <fieldset>
                <legend>Jenis Kelamin</legend>
                <input type="radio" name="jk" id="pria" value="pria">
                <label for="pria">Pria</label>
                <input type="radio" name="jk" id="wanita" value="wanita">
                <label for="wanita">Wanita</label>
            </fieldset>
            <button type="submit">Kirim</button>
        </form>
        <img src="profil.jpg" alt="Foto Profil Pengguna">
    </main>
    <footer><p>&copy; 2026 Praktikum PAW</p></footer>
</body>
</html>
